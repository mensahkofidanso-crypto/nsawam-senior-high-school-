<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nsawam Senior High School</title>

    <style>
        /* Multiple coloured background */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(
                135deg,
                #004d40,
                #00695c,
                #1565c0,
                #6a1b9a,
                #ad1457
            );
            background-attachment: fixed;
        }

        /* Header */
        header {
            text-align: center;
            padding: 35px 20px;
            background: rgba(0, 0, 0, 0.45);
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            font-size: 20px;
        }

        /* Logo */
        .logo {
            width: 120px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 3px solid white;
        }

        /* Navigation */
        nav {
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        /* Sections */
        section {
            margin: 25px auto;
            padding: 25px;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #ffeb3b;
            text-align: center;
        }

        /* Courses */
        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .course {
            background: rgba(0, 0, 0, 0.35);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .course:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
            transition: 0.3s;
        }

        /* Pictures */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid white;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <img src="logo.jpg" alt="Nsawam SHS Logo" class="logo">
        <h1>Nsawam Senior High School</h1>
        <p>Knowledge • Discipline • Excellence</p>
        <p>📍 Location: Nsawam, Eastern Region, Ghana</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#about">About</a>
        <a href="#courses">Courses</a>
        <a href="#gallery">Pictures</a>
    </
